apiVersion: v1
kind: Pod

metadata:
  name: nginx-lab
  labels:
    app: nginx-lab

spec:
  containers:
  - name: nginx
    image: nginx:latest

    ports:
    - containerPort: 80

    volumeMounts:
    - name: html-volume
      mountPath: /usr/share/nginx/html

  volumes:
  - name: html-volume
    hostPath:
      path: /home/u1/k8s_labs/bouns
      type: DirectoryOrCreate
